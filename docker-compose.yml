# One command to run the whole demo: `docker compose up --build`.
#
#   db       — Postgres 16 + pgvector (our docker/postgres image)
#   backend  — FastAPI; on start it runs `alembic upgrade head` then serves the
#              API AND the built Svelte SPA on http://localhost:8000
#
# The frontend is compiled into the backend image (multi-stage build) so there's
# a single URL to open. For hot-reload frontend dev, see the README ("Dev mode").
services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: . # repo root: the backend image compiles both frontend/ and backend/
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # asyncpg URL the app uses; points at the db service on the compose network
      DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/ragdb
      # The class LLM proxy (OpenAI-compatible). Override with your own if needed.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://llm.nat-d.uk/v1}
      # Your personal key from the course portal (Profile -> API key). Required.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your .env (see .env.example)}
      CHAT_MODEL: ${CHAT_MODEL:-gemma-4-E4B-it}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    ports:
      - "8000:8000"

volumes:
  pgdata:
