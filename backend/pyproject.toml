[project]
name = "kmitl-rag-demo"
version = "1.0.0"
description = "A layered full-stack RAG demo (pgvector + FastAPI + Svelte) for the KMITL LLM course."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",      # sync driver, used by Alembic
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "python-multipart>=0.0.9",   # required by FastAPI for file uploads
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
